<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Selectores CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Selector de ID -->
    <div id="main-header">
        <h1>Demostración de Selectores CSS</h1>
    </div>

    <!-- Selector de Clase -->
    <div class="card">
        <h2>Tarjeta Informativa</h2>
        <!-- Selector Descendiente: p dentro de .card -->
        <p>Este es un párrafo dentro de una tarjeta. Usa un <span class="destacado">texto destacado</span>.</p>
    </div>

    <div class="card">
        <h2>Otra Tarjeta</h2>
        <p>Otro párrafo dentro de una tarjeta con más <span class="destacado">contenido especial</span>.</p>
    </div>

</body>
</html>
