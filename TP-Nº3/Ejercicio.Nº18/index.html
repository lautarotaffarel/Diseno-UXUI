<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Galería Mosaico (CSS Grid)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 class="title">Galería Mosaico</h1>

    <main class="grid-mosaico">
        <div class="item item-destacado">
            <img src="https://picsum.photos/600/600?random=1" alt="Imagen Destacada">
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/300?random=2" alt="Imagen 2">
        </div>
        <div class="item item-horizontal">
            <img src="https://picsum.photos/600/300?random=3" alt="Imagen 3">
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/300?random=4" alt="Imagen 4">
        </div>
        <div class="item item-vertical">
            <img src="https://picsum.photos/300/600?random=5" alt="Imagen 5">
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/300?random=6" alt="Imagen 6">
        </div>
        <div class="item">
            <img src="https://picsum.photos/300/300?random=7" alt="Imagen 7">
        </div>
    </main>

</body>
</html>
