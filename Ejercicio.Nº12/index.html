<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12 - Posicionamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="inicio">

    <h1>Demostración de Posicionamiento</h1>
    <p>Haz scroll hacia abajo para probar el botón "Volver arriba".</p>

    <!-- Elemento con Tooltip -->
    <div class="tooltip-container">
        Pasa el cursor por aquí
        <span class="tooltip-text">¡Hola! Soy un Tooltip</span>
    </div>

    <!-- Espaciador para generar scroll -->
    <div class="spacer"></div>

    <!-- Botón Volver Arriba -->
    <a href="#inicio" class="btn-top">↑</a>

</body>
</html>
