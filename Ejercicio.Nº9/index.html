<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de Tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Galería de Productos</h1>

    <div class="gallery">
        <!-- Tarjeta 1 -->
        <article class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Producto 1">
            <h3>Producto 1</h3>
            <p class="price">$25.000</p>
            <button class="btn">Comprar</button>
        </article>

        <!-- Tarjeta 2 -->

            <img src="https://picsum.photos/300/200?random=2" alt="Producto 2">
            <h3>Producto 2</h3>

            <button class="btn">Comprar</button>
        </article>

        <!-- Tarjeta 3 -->

            <button class="btn">Comprar</button>
        </article>

        <!-- Tarjeta 4 -->

        <!-- Tarjeta 5 -->

        <!-- Tarjeta 6 -->

            <h3>Producto 6</h3>
            <p class="price">$28.900</p>
            <button class="btn">Comprar</button>
        </article>
    </div>

</body>
</html>
